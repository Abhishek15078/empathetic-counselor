version: "3.9"

services:

  backend:

    build:
      context: ./backend

    container_name: empathetic-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./chroma_db:/app/chroma_db

    restart: unless-stopped

  frontend:

    build:
      context: ./frontend

    container_name: empathetic-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped